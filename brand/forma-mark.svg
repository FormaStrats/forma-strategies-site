<svg xmlns="http://www.w3.org/2000/svg" viewBox="120 104 280 296" width="560" height="592" role="img" aria-label="Forma Strategies">
  <title>Forma Strategies</title>
  <defs>
    <!-- Polished silver face: bright top, darker band, light return at the bottom edge -->
    <linearGradient id="fm-face" x1="0" y1="0" x2="0.16" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#E3E3E7"/>
      <stop offset="0.68" stop-color="#A6A6AE"/>
      <stop offset="1" stop-color="#EEEEF1"/>
    </linearGradient>
    <!-- Extruded side, read as the thickness of the bar -->
    <linearGradient id="fm-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#76767E"/>
      <stop offset="1" stop-color="#3A3A40"/>
    </linearGradient>
  </defs>
  <g transform="translate(-3 4)">
    <g fill="url(#fm-side)" transform="translate(6 6)">
      <polygon points="150,186 368,131.5 368,185.5 150,240"/>
      <polygon points="150,262 328,217.5 328,261.5 150,306"/>
      <polygon points="150,328 210,313 210,357 150,372"/>
    </g>
    <g fill="url(#fm-face)">
      <polygon points="150,186 368,131.5 368,185.5 150,240"/>
      <polygon points="150,262 328,217.5 328,261.5 150,306"/>
      <polygon points="150,328 210,313 210,357 150,372"/>
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1.6" stroke-linecap="round">
      <polyline points="150,186 368,131.5"/>
      <polyline points="150,262 328,217.5"/>
      <polyline points="150,328 210,313"/>
    </g>
  </g>
</svg>
